name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check test catalog and CI guards
        run: |
          python3 scripts/ci-tests.py check
          python3 -m unittest discover -s scripts/tests
      - name: Select checks
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi
          python3 scripts/ci-paths.py "$base" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.paths.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Check generated variant contracts
        if: steps.paths.outputs.android == 'true'
        run: python3 scripts/ci-variants.py
      - name: Check F-Droid generated contracts
        if: steps.paths.outputs.android == 'true'
        run: python3 scripts/ci-variants.py --fdroid
      - name: Compile Stable Debug and unit tests once
        id: compile
        if: steps.paths.outputs.android == 'true'
        run: ./gradlew :app:compileStableDebugUnitTestSources --console=plain --max-workers=2
      - name: Tests / app-distribution
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic app-distribution
      - name: Tests / data-backup
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic data-backup
      - name: Tests / devices-layouts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic devices-layouts
      - name: Tests / editing
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic editing
      - name: Tests / ime-integration
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic ime-integration
      - name: Tests / keys-modifiers
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic keys-modifiers
      - name: Tests / speech
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic speech
      - name: Tests / suggestions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic suggestions
      - name: Tests / ui-settings
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic ui-settings
      - name: Tests / unsorted (Aufräumbedarf)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 scripts/ci-tests.py run --topic unsorted
      - name: Analyze representative lint
        id: lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./gradlew :app:lintStableDebug --console=plain --max-workers=2
      - name: Reject new lint errors
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: python3 scripts/check-lint.py app/build/reports/lint-results-stableDebug.xml
      - name: Build representative minified release
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.paths.outputs.release == 'true' }}
        run: ./gradlew :app:assembleStableRelease -PPLEKTRA_UNSIGNED_RELEASE_BUILD=true --console=plain --max-workers=2
      - name: Upload reports
        if: ${{ !cancelled() && steps.paths.outputs.android == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/ci-reports
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml

  gradle-checks:
    if: always()
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Failed or incomplete checks: ' + ', '.join(failed))
          PY
