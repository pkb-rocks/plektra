name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "CalVer version, e.g. 26.10"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string
      create_github_release:
        description: "Create a GitHub release and attach the APK"
        required: true
        default: false
        type: boolean
      build_fdroid_artifact:
        description: "Also build the unsigned F-Droid APK artifact"
        required: true
        default: true
        type: boolean

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          PLEKTRA_KEYSTORE_B64: ${{ secrets.PLEKTRA_KEYSTORE_B64 }}
        run: |
          mkdir -p release
          echo "$PLEKTRA_KEYSTORE_B64" | base64 -d > release/plektra-release.jks

      - name: Create keystore.properties
        env:
          PLEKTRA_KEYSTORE_PASSWORD: ${{ secrets.PLEKTRA_KEYSTORE_PASSWORD }}
          PLEKTRA_KEY_ALIAS: ${{ secrets.PLEKTRA_KEY_ALIAS }}
          PLEKTRA_KEY_PASSWORD: ${{ secrets.PLEKTRA_KEY_PASSWORD }}
        run: |
          cat > release/keystore.properties <<EOF
          storeFile=plektra-release.jks
          storePassword=$PLEKTRA_KEYSTORE_PASSWORD
          keyAlias=$PLEKTRA_KEY_ALIAS
          keyPassword=$PLEKTRA_KEY_PASSWORD
          EOF

      - name: Run stable unit tests
        run: |
          python3 scripts/ci-tests.py run --variant StableDebug \
            --gradle-arg=-PPLEKTRA_VERSION_CODE=${{ inputs.version_code }} \
            --gradle-arg=-PPLEKTRA_VERSION_NAME=${{ inputs.version_name }}

      - name: Check F-Droid generated contracts
        if: ${{ inputs.build_fdroid_artifact }}
        run: |
          python3 scripts/ci-variants.py --fdroid \
            --gradle-arg=-PPLEKTRA_VERSION_CODE=${{ inputs.version_code }} \
            --gradle-arg=-PPLEKTRA_VERSION_NAME=${{ inputs.version_name }}

      - name: Check generated variant contracts
        run: python3 scripts/ci-variants.py

      - name: Build release APK
        run: |
          ./gradlew :app:assembleStableRelease \
            -PPLEKTRA_VERSION_CODE=${{ inputs.version_code }} \
            -PPLEKTRA_VERSION_NAME=${{ inputs.version_name }}

      - name: Verify built stable package
        run: |
          python3 scripts/ci-artifact.py app/build/outputs/apk/stable/release/app-stable-release.apk \
            --package rocks.pkb.plektra --version-name '${{ inputs.version_name }}' \
            --version-code '${{ inputs.version_code }}'

      - name: Archive signed release outputs
        run: |
          mkdir -p /tmp/plektra-release-artifacts
          cp app/build/outputs/apk/stable/release/app-stable-release.apk /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk

      - name: Verify APK signing
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk

      - name: Compute checksums
        run: |
          sha256sum /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk \
            | tee /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk.sha256

      - name: Build unsigned F-Droid APK
        if: ${{ inputs.build_fdroid_artifact }}
        run: |
          ./gradlew :app:assembleStableRelease \
            -PPLEKTRA_VERSION_CODE=${{ inputs.version_code }} \
            -PPLEKTRA_VERSION_NAME=${{ inputs.version_name }} \
            -PPLEKTRA_FDROID_BUILD=true

      - name: Verify built F-Droid package
        if: ${{ inputs.build_fdroid_artifact }}
        run: |
          python3 scripts/ci-artifact.py app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk \
            --package rocks.pkb.plektra --version-name '${{ inputs.version_name }}' \
            --version-code '${{ inputs.version_code }}'

      - name: Archive unsigned F-Droid outputs
        if: ${{ inputs.build_fdroid_artifact }}
        run: |
          cp app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-fdroid-unsigned.apk
          sha256sum /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-fdroid-unsigned.apk \
            | tee /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-fdroid-unsigned.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plektra-${{ inputs.version_name }}-release
          path: |
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk.sha256

      - name: Upload F-Droid APK artifact
        if: ${{ inputs.build_fdroid_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: plektra-${{ inputs.version_name }}-fdroid
          path: |
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-fdroid-unsigned.apk
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-fdroid-unsigned.apk.sha256

      - name: Create GitHub release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Plektra v${{ inputs.version_name }}
          generate_release_notes: true
          files: |
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk
            /tmp/plektra-release-artifacts/plektra-${{ inputs.version_name }}-release-signed.apk.sha256
